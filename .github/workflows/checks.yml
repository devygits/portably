name: Portably source checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the starter and Portably's own source
        run: python portably.py check starter --framework --no-browser

      - name: Install the browser for the rendered checks
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check the documentation project in a browser
        run: python portably.py check docs --strict

      - name: Generated files are committed
        run: git diff --exit-code starter docs/tokens docs/DESIGN-SYSTEM.md docs/DESIGN-SYSTEM.html

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v